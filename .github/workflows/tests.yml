name: Testes de automação QA

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual — {0}', github.event.inputs.tipo_suite) || format('CI — {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tipo_suite:
        description: 'Conjunto de testes a executar (tags Playwright / BDD)'
        type: choice
        required: true
        default: completo
        options:
          - completo
          - sanity
          - critical
          - regression
          - ui
          - api
      com_relatorios:
        description: 'Gerar Allure + Playwright e enviar como artifacts (não publica no Pages)'
        type: boolean
        required: false
        default: true
  # Quando quiser agendar (ex.: 3x/dia UTC), descomente e ajuste o job `regression` (if) em baixo.
  # schedule:
  #   - cron: '0 8 * * *'
  #   - cron: '0 14 * * *'
  #   - cron: '0 20 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Relativo à raiz do checkout; preenchido após clone de gh-pages nos jobs que geram Allure
  ALLURE_HISTORY_SOURCE: gh-pages-prev/allure/history

jobs:
  # ─── PR / Push: gate sanity + suite completa + relatórios ───────────────────
  sanity:
    name: 'PR / push — Gate @sanity e relatórios'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Cache dos browsers Playwright
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Instalar browsers Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependências de sistema Playwright (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Gate — suite @sanity (falha bloqueia o job)
        run: npm run test:sanity
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
          UI_USER: ${{ secrets.UI_USER }}
          UI_PASS: ${{ secrets.UI_PASS }}

      - name: Suite completa (relatório; falhas conhecidas não bloqueiam)
        if: always()
        run: npm test
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
          UI_USER: ${{ secrets.UI_USER }}
          UI_PASS: ${{ secrets.UI_PASS }}

      - name: Histórico Allure (clone opcional de gh-pages)
        if: always()
        run: bash scripts/ci-clone-gh-pages.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Instalar Java (Allure CLI)
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gerar relatório Allure
        if: always()
        run: npm run report:allure:generate

      - name: Montar pasta combinada para GitHub Pages
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports/pages/playwright reports/pages/allure
          if [ -d reports/playwright-report ] && [ -f reports/playwright-report/index.html ]; then
            cp -r reports/playwright-report/. reports/pages/playwright/
          else
            printf '%s\n' '<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><title>Playwright</title></head><body><p>Relatório Playwright indisponível nesta execução.</p></body></html>' > reports/pages/playwright/index.html
          fi
          if [ -d reports/allure-report ] && [ -f reports/allure-report/index.html ]; then
            cp -r reports/allure-report/. reports/pages/allure/
          else
            printf '%s\n' '<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><title>Allure</title></head><body><p>Relatório Allure indisponível nesta execução.</p></body></html>' > reports/pages/allure/index.html
          fi
          cp .github/pages-index.html reports/pages/index.html

      - name: Enviar artifact GitHub Pages
        uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: reports/pages/

      - name: Artifact — relatório Playwright
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-sanity
          path: reports/playwright-report/
          retention-days: 7

      - name: Artifact — resultados Allure (raw)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-sanity
          path: reports/allure-results/
          retention-days: 7

  # ─── Push em main: testes @critical após o gate ────────────────────────────
  critical:
    name: 'Merge em main — testes @critical'
    runs-on: ubuntu-latest
    needs: sanity
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Cache dos browsers Playwright
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Instalar browsers Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependências de sistema Playwright (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Executar testes @critical
        run: npm run test:critical
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
          UI_USER: ${{ secrets.UI_USER }}
          UI_PASS: ${{ secrets.UI_PASS }}

      - name: Histórico Allure (clone opcional de gh-pages)
        if: always()
        run: bash scripts/ci-clone-gh-pages.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Instalar Java (Allure CLI)
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gerar relatório Allure
        if: always()
        run: npm run report:allure:generate

      - name: Artifact — relatório Playwright
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-critical
          path: reports/playwright-report/
          retention-days: 14

      - name: Artifact — resultados Allure (raw)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-critical
          path: reports/allure-results/
          retention-days: 14

  # ─── Execução manual: escolha de suite (workflow_dispatch) ─────────────────
  execucao_manual:
    name: 'Manual — ${{ github.event.inputs.tipo_suite }}'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 45

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Cache dos browsers Playwright
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Instalar browsers Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependências de sistema Playwright (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Executar testes (conforme escolha no formulário)
        run: |
          set -euo pipefail
          T="${{ github.event.inputs.tipo_suite }}"
          case "$T" in
            completo)     npm test ;;
            sanity)       npm run test:sanity ;;
            critical)     npm run test:critical ;;
            regression)   npm run test:regression ;;
            ui)           npm run test:ui ;;
            api)          npm run test:api ;;
            *)            echo "Opção inválida: $T"; exit 1 ;;
          esac
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
          UI_USER: ${{ secrets.UI_USER }}
          UI_PASS: ${{ secrets.UI_PASS }}

      - name: Histórico Allure (clone opcional de gh-pages)
        if: ${{ always() && github.event.inputs.com_relatorios == 'true' }}
        run: bash scripts/ci-clone-gh-pages.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Instalar Java (Allure CLI)
        if: ${{ always() && github.event.inputs.com_relatorios == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gerar relatório Allure
        if: ${{ always() && github.event.inputs.com_relatorios == 'true' }}
        run: npm run report:allure:generate

      - name: Artifact — relatório Playwright
        if: ${{ always() && github.event.inputs.com_relatorios == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-manual-${{ github.event.inputs.tipo_suite }}
          path: reports/playwright-report/
          retention-days: 14

      - name: Artifact — relatório Allure (HTML)
        if: ${{ always() && github.event.inputs.com_relatorios == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-manual-${{ github.event.inputs.tipo_suite }}
          path: reports/allure-report/
          retention-days: 14

      - name: Artifact — resultados Allure (raw)
        if: ${{ always() && github.event.inputs.com_relatorios == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-manual-${{ github.event.inputs.tipo_suite }}
          path: reports/allure-results/
          retention-days: 14

  # ─── Deploy: publica relatórios no GitHub Pages ───────────────────────────
  deploy-report:
    name: 'Publicar relatórios no GitHub Pages'
    # Com `schedule` + regression ativos, pode passar a depender também de `regression` e usar `if: always()` + ramo schedule.
    needs: [sanity, critical]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy para GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # ─── Regressão agendada + Pages (desativado até existir `on.schedule` acima) ─
  regression:
    name: 'Agendado — regressão + Pages (inativo)'
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 30

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Cache dos browsers Playwright
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-all-${{ hashFiles('package-lock.json') }}

      - name: Instalar browsers Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Dependências de sistema Playwright (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Executar todos os testes
        run: npm test
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_URL: ${{ secrets.API_URL }}
          UI_USER: ${{ secrets.UI_USER }}
          UI_PASS: ${{ secrets.UI_PASS }}

      - name: Histórico Allure (clone opcional de gh-pages)
        if: always()
        run: bash scripts/ci-clone-gh-pages.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Instalar Java (Allure CLI)
        if: always()
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gerar relatório Allure
        if: always()
        run: npm run report:allure:generate

      - name: Montar pasta combinada para GitHub Pages
        if: always()
        run: |
          set -euo pipefail
          mkdir -p reports/pages/playwright reports/pages/allure
          if [ -d reports/playwright-report ] && [ -f reports/playwright-report/index.html ]; then
            cp -r reports/playwright-report/. reports/pages/playwright/
          else
            printf '%s\n' '<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><title>Playwright</title></head><body><p>Relatório Playwright indisponível nesta execução.</p></body></html>' > reports/pages/playwright/index.html
          fi
          if [ -d reports/allure-report ] && [ -f reports/allure-report/index.html ]; then
            cp -r reports/allure-report/. reports/pages/allure/
          else
            printf '%s\n' '<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><title>Allure</title></head><body><p>Relatório Allure indisponível nesta execução.</p></body></html>' > reports/pages/allure/index.html
          fi
          cp .github/pages-index.html reports/pages/index.html

      - name: Enviar artifact GitHub Pages
        uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: reports/pages/

      - name: Artifact — relatório Playwright
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-regression
          path: reports/playwright-report/
          retention-days: 30

      - name: Artifact — relatório Allure (HTML)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-report-regression
          path: reports/allure-report/
          retention-days: 30
